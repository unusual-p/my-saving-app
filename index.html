<!DOCTYPE html>
<html lang="ja">
<head>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9924634834401471"
     crossorigin="anonymous"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LifeTools - 毎日を便利にするアプリ集</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .portal-header { text-align: center; margin-top: 30px; margin-bottom: 30px; }
        .portal-header h1 { font-size: 24px; color: var(--accent-orange); margin-bottom: 5px; }
        .app-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; width: 100%; max-width: 500px; }
        .app-card {
            background: var(--card-bg); padding: 20px; border-radius: 20px; text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); cursor: pointer; transition: transform 0.2s;
        }
        .app-card:active { transform: scale(0.95); }
        .app-icon { font-size: 40px; margin-bottom: 10px; display: block; }
        .app-name { font-weight: bold; font-size: 14px; }
    </style>
</head>
<body>

    <div class="page">
        <div class="portal-header">
            <h1>LifeTools</h1>
            <p>毎日を少し便利にするツール集</p>
        </div>
        <div class="app-grid">
            <div class="app-card" onclick="location.href='/saving/'">
                <span class="app-icon">☕</span>
                <span class="app-name">スタバ貯金</span>
            </div>
            <div class="app-card" onclick="location.href='/guchi/'">
                <span class="app-icon">🗑️</span>
                <span class="app-name">愚痴のゴミ箱</span>
            </div>
            <div class="app-card" onclick="location.href='/countdown/'">
                <span class="app-icon">⏳</span>
                <span class="app-name">あと何日？</span>
            </div>
            <div class="app-card" onclick="location.href='/pomodoro/'">
                <span class="app-icon">🍅</span>
                <span class="app-name">ポモドーロタイマー</span>
            </div>
        </div>
    </div>

    <nav class="nav-menu">
        <button class="nav-item active-nav" onclick="location.href='/'">🏠<br>ホーム</button>
        <button class="nav-item" onclick="location.href='/privacy/'">📄<br>規約</button>
    </nav>

</body>
</html>
