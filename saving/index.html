<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>スタバ貯金 - LifeTools</title>
    <link rel="stylesheet" href="../style.css">
    <style>
        /* スタバ貯金専用の微調整 */
        .app-container {
            background-color: white; 
            padding: 40px 20px; 
            border-radius: 30px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05); 
            width: 100%; 
            max-width: 350px;
            display: flex; 
            flex-direction: column; 
            align-items: center;
        }
        .save-button {
            background-color: #a9d479; /* 添付画像の緑 */
            border: none; 
            padding: 30px 20px; 
            border-radius: 40px; /* 大きめの角丸 */
            width: 100%; 
            cursor: pointer; 
            box-shadow: 0 4px 10px rgba(169, 212, 121, 0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            line-height: 1.4;
        }
        .reset-button {
            background: #d4ac0d; /* 添付画像のオレンジゴールド */
            color: white;
            border: none; 
            padding: 10px 30px; 
            border-radius: 20px; 
            margin-top: 30px; 
            font-weight: bold; 
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="page active">
        <div class="app-container">
            <h2 style="font-size: 20px; margin-bottom: 25px; color: #333;">スタバ貯金</h2>
            
            <div style="text-align:center; margin-bottom:40px; color: #555;">
                <p style="margin: 0;">これまでに</p>
                <span class="total-amount" style="font-size: 56px; margin: 10px 0;">¥<span id="balance">0</span></span>
                <p style="margin: 0;">貯金できたよ！</p>
            </div>

            <button class="save-button" onclick="addMoney()">
                <span style="font-size:16px; color:#333;">今日も買わなかった</span>
                <span style="font-size:32px; font-weight:bold; color:#000;">¥500</span>
            </button>

            <button class="reset-button" onclick="openResetModal()">リセット</button>
        </div>

        <article class="detail-content" style="margin-top: 30px;">
            <h2>スタバ貯金で賢く節約</h2>
            <p>毎日何気なく買っているコーヒー代。実はその支出を見直すだけで、大きな貯金に変わります。このアプリは、あなたの節約の達成感を可視化するために作られました。</p>
            <p>ボタンを押すたびに、未来の自分のために500円を積み立てていきましょう。</p>
            <button onclick="location.href='/saving/tips/'" style="width:100%; padding:15px; background:var(--accent-orange); color:white; border:none; border-radius:10px; font-weight:bold; cursor:pointer; margin-top:10px;">
                貯金術コラム一覧を見る →
            </button>
        </article>
    </div>

    <script>
        let currentBalance = parseInt(localStorage.getItem('mySavingAppBalance')) || 0;
        const balanceDisplay = document.getElementById('balance');
        balanceDisplay.innerText = currentBalance.toLocaleString();

        function addMoney() { 
            currentBalance += 500; 
            balanceDisplay.innerText = currentBalance.toLocaleString(); 
            localStorage.setItem('mySavingAppBalance', currentBalance); 
        }

        function openResetModal() {
            if(confirm('本当にリセットしますか？')) {
                currentBalance = 0;
                balanceDisplay.innerText = '0';
                localStorage.setItem('mySavingAppBalance', 0);
            }
        }
    </script>
</body>
</html>
